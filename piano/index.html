<!DOCTYPE html>

<html>
    <head>
        <title>don's piano</title> <!-- change if you want -->
        <link rel="stylesheet" href="piano.css?v=0">
        <link rel="icon" type="image/png" href="/shared/img/DarcyIcon.png">
    
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    </head>
    <body>
        <div id="pianocontainer">
            <div id="main">
                <img src="img/piano.png" id="piano">
                <div id="songlist">
                    
                </div>
            </div>
            <p id="songname" class="songname">temp</p>

            <div>
                <input type="checkbox" id="autoplay" name="autoplay">
                <label for="autoplay">Auto-play next song?</label>
                <br>
                <input type="checkbox" id="looponce" name="looponce">
                <label for="looponce">Loop this song?</label>
                <br><br>
                <input type="checkbox" id="shuffle" name="shuffle">
                <label for="shuffle">Shuffle playlist? (auto-play only)</label>
                <br>
                <input type="checkbox" id="loop" name="loop">
                <label for="autoplay">Loop playlist? (auto-play only)</label>
            </div>

            <span>
                <p>Update as of 9/18/26, ive gotten a keyboard from my great grandfather.</p>
                <p>Ive enjoyed learning so far, now i dont have to worry about not letting myself play.</p>
            </span>
        </div>
    </body>
</html>
