        <div id="container">
            <h1>VOICE CHATROOM</h1>
            <div id="vc-frame">
                <div id="vc-body">
                    
                </div>
                <div id="vc-sidebar">
                    <div id="vc-controls-md">
                        <div class="vc-control-button vc-clickable" id="mute">
                            <img class="vc-control-button-graphic" src="img/unmute.png">
                        </div>
                        <div class="vc-control-button vc-clickable" id="deafen">
                            <img class="vc-control-button-graphic" src="img/undeafen.png">
                        </div>
                    </div>
                    <div id="vc-controls-gains">
                        <div class="vc-control-gain">
                            <p>INPUT</p>
                            <input type="range" id="inputgain" min="0" max="3" step="0.025">
                        </div>
                        <div class="vc-control-gain">
                            <p>OUTPUT</p>
                            <input type="range" id="outputgain" min="0" max="1" step="0.008">
                        </div>
                    </div>
                </div>

                <div id="vc-blanker">
                    <button id="activate">join chatroom!!</button>
                </div>
            </div>
        </div>
