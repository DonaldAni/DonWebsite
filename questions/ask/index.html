<html>
    <head>
        <link rel="stylesheet" href="/shared/css/style.css">
        <link rel="icon" type="image/png" href="/shared/img/DarcyIcon.png">
        
        <title>Don's Residence</title>

        <meta content="DONALDANI.org" property="og:title" />
        <meta content="WHERE FUN GOES TO THRIVE" property="og:description" />

        <meta property="og:type" content="article">
        <meta content="https://donaldani.org" property="og:url" />

        <meta property="og:image" content="/shared/img/embed.gif">
        <meta property="og:image:type" content="image/gif">
        <meta property="og:image:width" content="640">
        <meta property="og:image:height" content="480">

        <meta name="twitter:title" content="DONALDANI.org">
        <meta name="twitter:description" content="WHERE FUN GOES TO THRIVE">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image:src" content="/shared/img/embed.gif">
        <meta name="theme-color" content="#f07e1a">
        
        <style>
            #questioninput {
                width: 30%;
                height: 20%;
                
                padding: .5%;
            }
        </style>
    </head>

    <body>
        <h1>ask the big don a question</h1>
        <img src="img/ask.png" height="400">
        <hr>
        <textarea id="questioninput" placeholder="enter question"></textarea>
        <br><br>
        <button id="sendquestion">send question</button>
    </body>
</html>

<script src="/shared/js/topbar.js"></script>
<script>
    const INPUT = document.getElementById("questioninput")
    const SEND = document.getElementById("sendquestion")
    
    const SENDTO = "https://donaldapi.kayladotcom.org/ask"
    
    SEND.addEventListener("click", async () => {
        if(INPUT.value.length > 0) {
            INPUT.remove()
            SEND.remove()
            
            let alert = document.createElement("h3")
            
            await fetch(SENDTO, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: INPUT.value
                })
            }).then((data) => {
                if(data.status == 200) {
                    alert.innerHTML = "question sent!"
                } else {
                    if(data.status == 429) {
                        // rate limited
                        alert.innerHTML = "you are asking questions too quickly!<br>try again later!"
                    } else {
                        alert.innerHTML = "question could not be sent!"
                    }
                }
            })
            
            document.body.appendChild(alert)

            let a = document.createElement("a")
                a.href = "../"
                a.innerHTML = "go back"

                document.body.appendChild(a)
        }
    })
</script>
